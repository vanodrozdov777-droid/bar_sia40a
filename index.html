.in{padding:0 14px 14px}

.req input{width:22px;height:22px;accent-color:var(--ac)}.req .d{opacity:.45;text-decoration:line-through}
.tag{font-size:.82rem;color:var(--mu);font-weight:400;margin-left:6px}

.brand{display:flex;align-items:center;gap:10px;margin:0 auto 10px;max-width:760px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-weight:900;font-size:21px}
.brand strong{display:block;letter-spacing:.14em;font-size:13px}
.brand small{display:block;color:var(--mu);font-size:11px;margin-top:1px}
.theme-btn{margin-left:auto;border:1px solid var(--ln);background:var(--sf);border-radius:9px;width:40px;height:40px}
header{padding:12px 14px 8px;box-shadow:0 4px 18px #00000008}
input[type=search]{max-width:760px;display:block;margin:0 auto 9px;min-height:46px}
.tabs{max-width:760px;margin:auto;scrollbar-width:thin}
.chip{transition:background .15s,border-color .15s}
main{padding:14px 14px 34px}
details{box-shadow:0 2px 8px #00000006;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";color:var(--mu);font-weight:400;font-size:20px}
details[open]>summary:after{content:"−"}
.pill{font-size:.82rem}
table tr td:first-child{width:72%}
.req label{gap:10px}
footer{max-width:760px;margin:0 auto;padding:0 14px 28px;color:var(--mu);font-size:12px;text-align:center}
@media(min-width:700px){main{padding-top:20px}header{padding-left:20px;padding-right:20px}}
