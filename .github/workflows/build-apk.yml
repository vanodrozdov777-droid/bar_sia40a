name: Build BAR DESK APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble Android project from flat files
        run: |
          set -eux
          ls -la
          for f in index.html build.gradle settings.gradle gradle.properties app-build.gradle AndroidManifest.xml MainActivity.java styles.xml ic_launcher.xml ic_launcher_foreground.xml; do
            test -s "$f" || { echo "MISSING FILE: $f"; exit 1; }
          done
          rm -rf app
          mkdir -p app/src/main/assets app/src/main/java/com/bardesk/app app/src/main/res/values app/src/main/res/drawable
          cp app-build.gradle app/build.gradle
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/bardesk/app/MainActivity.java
          cp styles.xml app/src/main/res/values/styles.xml
          cp ic_launcher.xml app/src/main/res/drawable/ic_launcher.xml
          cp ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          cp index.html app/src/main/assets/index.html
          find app -type f

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Show APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BAR-DESK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
